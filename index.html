<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StockCrypto PRO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://s3.tradingview.com/tv.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827 55%, #1e293b);
      color: #fff;
      min-height: 100vh;
    }
    h2, h3 { margin: 12px 0; }
    .sub { color: #cbd5e1; font-size: 13px; margin-bottom: 12px; line-height: 1.4; }
    #tvchart {
      height: 360px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      margin: 14px 0 10px;
      background: #000;
    }
    .signal {
      margin: 12px 0 16px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }
    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0 18px;
    }
    button {
      border: 0;
      padding: 12px 16px;
      border-radius: 999px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    .buy { background: linear-gradient(45deg, #16a34a, #22c55e); }
    .sell { background: linear-gradient(45deg, #dc2626, #ef4444); }
    .hold { background: linear-gradient(45deg, #d97706, #f59e0b); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin: 10px 0 18px;
    }
    .card {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      padding: 12px;
      min-height: 78px;
    }
    .label { color: #cbd5e1; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 16px; font-weight: 700; }
    .small { font-size: 12px; color: #cbd5e1; margin-top: 4px; line-height: 1.35; }
  </style>
</head>
<body>
  <h2>StockCrypto PRO</h2>
  <div class="sub">
    Telegram Mini App для Android. Реал-тайм котировки, TradingView, сигналы, новости и on-chain.
  </div>

  <div id="tvchart"></div>

  <div id="signal" class="signal">Загрузка сигнала...</div>

  <div class="buttons">
    <button class="buy" onclick="trade('buy')">Купить</button>
    <button class="sell" onclick="trade('sell')">Продать</button>
    <button class="hold" onclick="trade('hold')">Держать</button>
  </div>

  <h3>Котировки</h3>
  <div id="quotes" class="grid"></div>

  <h3>Новости</h3>
  <div id="news" class="grid"></div>

  <h3>On-chain</h3>
  <div id="metrics" class="grid"></div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    const FINNHUB_KEY = 'PASTE_YOUR_FINNHUB_KEY_HERE';

    new TradingView.widget({
      container_id: "tvchart",
      width: "100%",
      height: 360,
      symbol: "NASDAQ:AAPL",
      interval: "5",
      timezone: "Etc/UTC",
      theme: "dark",
      style: "1",
      locale: "ru",
      enable_publishing: false,
      hide_legend: false,
      hide_top_toolbar: false,
      allow_symbol_change: true,
      studies: [
        "RSI@tv-basicstudies",
        "BB@tv-basicstudies",
        "MASimple@tv-basicstudies"
      ]
    });

    async function getQuote(symbol) {
      const url = `https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_KEY}`;
      const res = await fetch(url);
      return await res.json();
    }

    async function updateQuotes() {
      try {
        const symbols = ["AAPL", "MSFT", "GOOGL", "BTCUSD"];
        const data = await Promise.all(symbols.map(getQuote));

        document.getElementById("quotes").innerHTML = symbols.map((s, i) => {
          const c = data[i].c ?? "-";
          const pc = data[i].pc ?? c;
          const change = pc ? (((c - pc) / pc) * 100).toFixed(2) : "0.00";
          const color = parseFloat(change) >= 0 ? "#22c55e" : "#ef4444";
          return `
            <div class="card">
              <div class="label">${s}</div>
              <div class="value">$${c}</div>
              <div class="small" style="color:${color}">${change}%</div>
            </div>
          `;
        }).join("");
      } catch (e) {
        document.getElementById("quotes").innerHTML = `
          <div class="card">
            <div class="label">Ошибка котировок</div>
            <div class="value">Проверьте FINNHUB_KEY</div>
          </div>
        `;
      }
    }

    async function updateSignal() {
      try {
        const now = Math.floor(Date.now() / 1000);
        const from = now - 3600 * 24;
        const url = `https://finnhub.io/api/v1/indicator?symbol=AAPL&resolution=5&from=${from}&to=${now}&indicator=rsi&timeperiod=14&token=${FINNHUB_KEY}`;
        const res = await fetch(url);
        const data = await res.json();

        let rsi = 50;
        if (data.rsi && data.rsi.length) rsi = data.rsi[data.rsi.length - 1];

        let signal = "ДЕРЖАТЬ";
        let color = "#f59e0b";

        if (rsi > 70) { signal = "ПРОДАТЬ"; color = "#ef4444"; }
        else if (rsi < 30) { signal = "КУПИТЬ"; color = "#22c55e"; }

        document.getElementById("signal").innerHTML =
          `<span style="color:${color}">RSI: ${Number(rsi).toFixed(1)} — ${signal}</span>`;
      } catch (e) {
        document.getElementById("signal").innerHTML = "ДЕРЖАТЬ";
      }
    }

    async function loadNews() {
      try {
        const feedUrl = "https://cointelegraph.com/rss";
        const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(feedUrl);
        const res = await fetch(proxyUrl);
        const text = await res.text();
        const xml = new DOMParser().parseFromString(text, "text/xml");
        const items = Array.from(xml.querySelectorAll("item")).slice(0, 6);

        document.getElementById("news").innerHTML = items.map(item => {
          const title = item.querySelector("title")?.textContent || "";
          const date = item.querySelector("pubDate")?.textContent || "";
          return `
            <div class="card">
              <div class="label">News</div>
              <div class="value">${title.slice(0, 70)}</div>
              <div class="small">${date}</div>
            </div>
          `;
        }).join("");
      } catch (e) {
        document.getElementById("news").innerHTML = `
          <div class="card">
            <div class="label">Новости</div>
            <div class="value">Не удалось загрузить</div>
          </div>
        `;
      }
    }

    async function loadMetrics() {
      try {
        const data = await fetch("https://api.bitcoin-data.com/v1/scalar/mvrv_zscore").then(r => r.json());
        const mvrv = data?.mvrv_zscore?.value ?? "-";
        const sopr = data?.sopr?.value ?? "-";
        const nvt = data?.network_value_to_transaction?.value ?? "-";

        document.getElementById("metrics").innerHTML = `
          <div class="card">
            <div class="label">BTC MVRV Z-Score</div>
            <div class="value">${mvrv}</div>
          </div>
          <div class="card">
            <div class="label">BTC SOPR</div>
            <div class="value">${sopr}</div>
          </div>
          <div class="card">
            <div class="label">NVT</div>
            <div class="value">${nvt}</div>
          </div>
        `;
      } catch (e) {
        document.getElementById("metrics").innerHTML = `
          <div class="card">
            <div class="label">On-chain</div>
            <div class="value">Не удалось загрузить</div>
          </div>
        `;
      }
    }

    function trade(action) {
      Telegram.WebApp.showAlert("Сигнал: " + action.toUpperCase());
    }

    updateQuotes();
    updateSignal();
    loadNews();
    loadMetrics();

    setInterval(updateQuotes, 60000);
    setInterval(updateSignal, 60000);
    setInterval(loadNews, 300000);
    setInterval(loadMetrics, 300000);
  </script>
</body>
</html>
