<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StockCrypto PRO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827 55%, #1e293b);
      color: #fff;
      min-height: 100vh;
    }
    h2, h3 { margin: 12px 0; }
    .sub { color: #cbd5e1; font-size: 13px; margin-bottom: 12px; line-height: 1.4; }
    #priceChart {
      height: 360px;
      width: 100%;
      border-radius: 14px;
      background: #0b1220;
      box-shadow: 0 10px 30px rgba(0,0,0,.35);
      padding: 8px;
    }
    .signal {
      margin: 12px 0 16px;
      padding: 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }
    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0 18px;
    }
    button {
      border: 0;
      padding: 12px 16px;
      border-radius: 999px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    .buy { background: linear-gradient(45deg, #16a34a, #22c55e); }
    .sell { background: linear-gradient(45deg, #dc2626, #ef4444); }
    .hold { background: linear-gradient(45deg, #d97706, #f59e0b); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 10px;
      margin: 10px 0 18px;
    }
    .card {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px;
      padding: 12px;
      min-height: 78px;
    }
    .label { color: #cbd5e1; font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 16px; font-weight: 700; }
    .small { font-size: 12px; color: #cbd5e1; margin-top: 4px; line-height: 1.35; }
  </style>
</head>
<body>
  <h2>StockCrypto PRO</h2>
  <div class="sub">Telegram Mini App для Android. Живой график, котировки, сигналы, новости и on-chain.</div>

  <div id="priceChart">
    <canvas id="chartCanvas"></canvas>
  </div>

  <div id="signal" class="signal">Загрузка сигнала...</div>

  <div class="buttons">
    <button class="buy" onclick="trade('buy')">Купить</button>
    <button class="sell" onclick="trade('sell')">Продать</button>
    <button class="hold" onclick="trade('hold')">Держать</button>
  </div>

  <h3>Котировки</h3>
  <div id="quotes" class="grid"></div>

  <h3>Новости</h3>
  <div id="news" class="grid"></div>

  <h3>On-chain</h3>
  <div id="metrics" class="grid"></div>

  <script>
    const FINNHUB_KEY = 'PASTE_YOUR_FINNHUB_KEY_HERE';
    let chart;

    window.onload = function () {
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
      }

      initChart();
      loadChartData();
      updateQuotes();
      updateSignal();
      loadNews();
      loadMetrics();

      setInterval(updateQuotes, 60000);
      setInterval(updateSignal, 60000);
      setInterval(loadChartData, 300000);
      setInterval(loadNews, 300000);
      setInterval(loadMetrics, 300000);
    };

    function initChart() {
      const ctx = document.getElementById('chartCanvas').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: 'AAPL',
            data: [],
            borderColor: '#22c55e',
            backgroundColor: 'rgba(34,197,94,0.15)',
            tension: 0.25,
            fill: true,
            pointRadius: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#fff' } }
          },
          scales: {
            x: { ticks: { color: '#cbd5e1' }, grid: { color: 'rgba(255,255,255,0.08)' } },
            y: { ticks: { color: '#cbd5e1' }, grid: { color: 'rgba(255,255,255,0.08)' } }
          }
        }
      });
    }

    async function loadChartData() {
      try {
        const now = Math.floor(Date.now() / 1000);
        const from = now - 3600 * 24 * 5;
        const url = `https://finnhub.io/api/v1/stock/candle?symbol=AAPL&resolution=60&from=${from}&to=${now}&token=${FINNHUB_KEY}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.s !== 'ok' || !data.c || !data.t) throw new Error('bad data');

        const labels = data.t.map(ts => new Date(ts * 1000).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }));
        chart.data.labels = labels;
        chart.data.datasets[0].data = data.c;
        chart.update();
      } catch (e) {
        document.getElementById('priceChart').innerHTML =
          "<div style='padding:16px;color:#fff'>График не загрузился. Проверьте Finnhub key.</div>";
      }
    }

    async function getQuote(symbol) {
      const url = `https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_KEY}`;
      const res = await fetch(url);
      return await res.json();
    }

    async function updateQuotes() {
      try {
        const symbols = ["AAPL", "MSFT", "GOOGL", "BTCUSD"];
        const data = await Promise.all(symbols.map(getQuote));

        document.getElementById("quotes").innerHTML = symbols.map((s, i) => {
          const c = data[i].c ?? "-";
          const pc = data[i].pc ?? c;
          const change = pc ? (((c - pc) / pc) * 100).toFixed(2) : "0.00";
          const color = parseFloat(change) >= 0 ? "#22c55e" : "#ef4444";
          return `
            <div class="card">
              <div class="label">${s}</div>
              <div class="value">$${c}</div>
              <div class="small" style="color:${color}">${change}%</div>
            </div>
          `;
        }).join("");
      } catch (e) {
        document.getElementById("quotes").innerHTML = `
          <div class="card"><div class="label">Ошибка котировок</div><div class="value">Проверьте FINNHUB_KEY</div></div>
        `;
      }
    }

    async function updateSignal() {
      try {
        const quote = await getQuote("AAPL");
        const c = quote.c ?? 0;
        const pc = quote.pc ?? c;
        const change = pc ? ((c - pc) / pc) * 100 : 0;

        let signal = "ДЕРЖАТЬ";
        let color = "#f59e0b";

        if (change > 1) { signal = "КУПИТЬ"; color = "#22c55e"; }
        if (change < -1) { signal = "ПРОДАТЬ"; color = "#ef4444"; }

        document.getElementById("signal").innerHTML =
          `<span style="color:${color}">AAPL: ${signal}</span>`;
      } catch (e) {
        document.getElementById("signal").innerHTML = "ДЕРЖАТЬ";
      }
    }

    async function loadNews() {
      try {
        const feedUrl = "https://cointelegraph.com/rss";
        const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(feedUrl);
        const res = await fetch(proxyUrl);
        const text = await res.text();
        const xml = new DOMParser().parseFromString(text, "text/xml");
        const items = Array.from(xml.querySelectorAll("item")).slice(0, 6);

        document.getElementById("news").innerHTML = items.map(item => {
          const title = item.querySelector("title")?.textContent || "";
          const date = item.querySelector("pubDate")?.textContent || "";
          return `
            <div class="card">
              <div class="label">News</div>
              <div class="value">${title.slice(0, 70)}</div>
              <div class="small">${date}</div>
            </div>
          `;
        }).join("");
      } catch (e) {
        document.getElementById("news").innerHTML = `
          <div class="card"><div class="label">Новости</div><div class="value">Не удалось загрузить</div></div>
        `;
      }
    }

    async function loadMetrics() {
      try {
        const data = await fetch("https://api.bitcoin-data.com/v1/scalar/mvrv_zscore").then(r => r.json());
        const mvrv = data?.mvrv_zscore?.value ?? "-";
        const sopr = data?.sopr?.value ?? "-";
        const nvt = data?.network_value_to_transaction?.value ?? "-";

        document.getElementById("metrics").innerHTML = `
          <div class="card"><div class="label">BTC MVRV Z-Score</div><div class="value">${mvrv}</div></div>
          <div class="card"><div class="label">BTC SOPR</div><div class="value">${sopr}</div></div>
          <div class="card"><div class="label">NVT</div><div class="value">${nvt}</div></div>
        `;
      } catch (e) {
        document.getElementById("metrics").innerHTML = `
          <div class="card"><div class="label">On-chain</div><div class="value">Не удалось загрузить</div></div>
        `;
      }
    }

    function trade(action) {
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.showAlert("Сигнал: " + action.toUpperCase());
      } else {
        alert("Сигнал: " + action.toUpperCase());
      }
    }
  </script>
</body>
</html>
