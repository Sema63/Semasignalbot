<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StockCrypto PRO</title>
  <script src="https://telegram.org/js/telegram-web-app.js"
    onerror="console.error('[StockCrypto] Failed to load Telegram Web App SDK')"></script>

  <!-- Vercel Speed Insights -->
  <script src="dist/speed-insights.min.js"
    onerror="console.warn('[StockCrypto] Speed Insights script failed to load — analytics disabled')"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
  </style>
</head>
<body>
  <h1>StockCrypto PRO</h1>
  <p>Telegram Web App</p>

  <script>
    window.addEventListener('error', function (event) {
      console.error('[StockCrypto] Uncaught error:', event.message, 'at', event.filename + ':' + event.lineno);
    });

    window.addEventListener('unhandledrejection', function (event) {
      console.error('[StockCrypto] Unhandled promise rejection:', event.reason);
    });

    // Verify Telegram Web App SDK loaded
    if (typeof window.Telegram === 'undefined' || !window.Telegram.WebApp) {
      console.error('[StockCrypto] Telegram WebApp SDK not available — app may not function correctly');
    }
  </script>
</body>
</html>
